# Version configuration for Ascend NPU image build
# All scripts (download-all.sh, build.sh) source this file.
# Keep CANN, torch, and torch_npu versions in sync (see README for compatibility matrix).

BASE_IMAGE=ubuntu:24.04
APT_MIRROR=mirrors.tuna.tsinghua.edu.cn
PIP_INDEX=https://pypi.tuna.tsinghua.edu.cn/simple

CANN_VERSION=9.1.0
SOC=910b
PYTHON_VERSION=3.12.13
PYTHON_MM=3.12
# Derived: cp312 for Python 3.12.x, cp313 for 3.13.x, etc.
PYTHON_CP="cp${PYTHON_MM//./}"

TORCH_VERSION=2.9.0
TORCHVISION_VERSION=0.24.0
TORCH_NPU_VERSION=2.9.0.post6
TORCH_INDEX=https://mirrors.huaweicloud.com/pytorch/wheels/cpu
